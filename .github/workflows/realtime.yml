name: Update realtime ETF monitor

on:
  workflow_dispatch:
  push:
    paths:
      - "update_realtime.py"
      - "realtime.json"
      - "market-calendar.json"
      - "realtime.js"
      - ".github/workflows/realtime.yml"
  schedule:
    # A股连续竞价：北京时间 09:30-11:30、13:00-15:00 ≈ UTC 01:30-03:30、05:00-07:00
    # 避开整点/整5分钟的拥挤调度点；脚本会用交易日历和时段决定是否可提醒。
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 1-3,5-7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-realtime-etf-monitor
  cancel-in-progress: true

jobs:
  update-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Update realtime JSON
        env:
          PYTHONUNBUFFERED: "1"
        run: python update_realtime.py

      - name: Commit realtime JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realtime.json
          git diff --cached --quiet && exit 0
          git commit -m "自动更新盘中ETF监控数据"
          git push
