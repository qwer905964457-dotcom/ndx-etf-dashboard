name: Update dashboard data

on:
  workflow_dispatch:
  push:
    paths:
      - "update_data.py"
      - "patch_risk_sources.py"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "40 1 * * 1-5"
    - cron: "40 2 * * 1-5"
    - cron: "40 3 * * 1-5"
    - cron: "40 5 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "40 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-dashboard-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Patch risk sources
        run: python patch_risk_sources.py

      - name: Update public market data
        run: python update_data.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json update_data.py
          git diff --cached --quiet && exit 0
          git commit -m "自动更新公开行情数据"
          git push
